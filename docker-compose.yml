version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: aurastate_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: aurastate
      MONGO_INITDB_ROOT_PASSWORD: aurastate_dev_secret
      MONGO_INITDB_DATABASE: aurastate
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurastate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
