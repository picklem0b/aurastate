name: PyTest — FastAPI Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurastate
          POSTGRES_PASSWORD: test_secret
          POSTGRES_DB: aurastate_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          cd apps/api
          pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://aurastate:test_secret@localhost:5432/aurastate_test
          ENVIRONMENT: test
          API_SECRET_KEY: test_secret_key_ci
