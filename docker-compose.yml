version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurastate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurastate
      POSTGRES_PASSWORD: aurastate_dev_secret
      POSTGRES_DB: aurastate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurastate"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aurastate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aurastate_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aurastate:aurastate_dev_secret@postgres:5432/aurastate
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
